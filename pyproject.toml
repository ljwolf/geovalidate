[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geovalidate"
version = "0.1.0"
description = "Scikit-learn compatible spatial point samplers for geospatial model validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
keywords = ["geopandas", "scikit-learn", "spatial", "sampling", "point-process"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=0.14",
    "scikit-learn>=1.3",
    "shapely>=2.0",
    "numpy>=1.24",
    "scipy>=1.7",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
dev = [
    "pytest>=7",
    "pytest-cov",
    "rasterio>=1.3",
]
docs = [
    "sphinx>=7,<9",
    "sphinx-immaterial>=0.13",
    "numpydoc>=1.8",
    "myst-nb>=1.2",
    "sphinxcontrib-bibtex>=2.6",
    "sphinx-copybutton>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geovalidate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
