name: geovalidate-docs

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12
  - geopandas>=0.14
  - scikit-learn>=1.3
  - shapely>=2.0
  - numpy>=1.24
  - scipy>=1.7
  - statsmodels>=0.14
  - libpysal
  - esda
  - rasterio>=1.3
  - mapclassify
  - networkx
  - hdbscan
  - geodatasets
  - ipykernel
  - nbclient
  - pip
  - pip:
    - sphinx>=7,<9
    - sphinx-immaterial>=0.13
    - numpydoc>=1.8
    - myst-nb>=1.2
    - sphinxcontrib-bibtex>=2.6
    - sphinx-copybutton>=0.5
